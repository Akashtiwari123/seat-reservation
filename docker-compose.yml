services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: seats, POSTGRES_USER: seats, POSTGRES_PASSWORD: seats }
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U seats -d seats"], interval: 3s, timeout: 3s, retries: 20 }
  app:
    build: .
    ports: ["8080:8080"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      DB_HOST: db
      ADMIN_TOKEN: admin-token
      TOKEN_SECRET: change-me-in-prod
